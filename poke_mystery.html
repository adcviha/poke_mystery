<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poké_Mystery</title>
<meta name="description" content="Take a quiz to reveal a Pokémon mystery.">
  <style>
/* ===== Poké_Mystery Styles =====
   Mystery Dungeon melancholia — quiet, earnest, soft.
   System serif for questions, system sans-serif for UI.
   Generous whitespace. No harsh colors. */

/* --- Reset & base --- */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background: transparent;
}

html, body {
  height: 100%;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  color: #3a3a3a;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
  background: linear-gradient(135deg, #d4e6d4 0%, #dce8f0 50%, #e8dce8 100%);
  transition: background 4s ease;
}

.env-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

#app {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* --- Screens --- */

.screen {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* --- Intro --- */

.intro-screen {
  text-align: center;
  gap: 2.5rem;
}

.intro-tagline {
  font-size: 1.35rem;
  line-height: 1.7;
  color: #4a4a4a;
  max-width: 400px;
}

/* --- Buttons --- */

.btn-start, .btn-retry {
  display: inline-block;
  padding: 0.8rem 2.2rem;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 1rem;
  color: #5a5a5a;
  background: rgba(255,255,255,0.65);
  border: 1px solid #c0c0c0;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.25s, transform 0.15s;
}

.btn-start:hover, .btn-retry:hover {
  background: rgba(255,255,255,0.9);
  transform: translateY(-1px);
}

.btn-start:active, .btn-retry:active {
  transform: translateY(0);
}

/* --- Question --- */

.question-progress {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 0.75rem;
  color: #999;
  margin-bottom: 1.5rem;
  letter-spacing: 0.05em;
}

.question-text {
  font-size: 1.2rem;
  line-height: 1.6;
  text-align: center;
  margin-bottom: 2rem;
  max-width: 500px;
  color: #444;
}

.question-options {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  width: 100%;
  max-width: 500px;
}

.option-btn {
  width: 100%;
  padding: 1rem 1.25rem;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 0.95rem;
  line-height: 1.45;
  text-align: left;
  color: #4a4a4a;
  background: rgba(255,255,255,0.55);
  border: 1px solid #d5d5d5;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
}

.option-btn:hover {
  background: rgba(255,255,255,0.85);
  border-color: #b0b0b0;
  transform: translateX(3px);
}

.option-btn:active {
  transform: translateX(0);
}

/* Selected state flash */
.option-btn.selected {
  background: rgba(200, 220, 240, 0.8);
  border-color: #90b0d0;
}

/* --- Briefcase --- */

.briefcase-screen {
  text-align: center;
}

.briefcase {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
  opacity: 0;
  animation: fadeInBriefcase 1.2s ease forwards;
}

@keyframes fadeInBriefcase {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

.briefcase-inner {
  width: 160px;
  height: 110px;
  background: linear-gradient(180deg, #c4a46c 0%, #a08050 60%, #8b6d3f 100%);
  border-radius: 8px 8px 12px 12px;
  position: relative;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}

/* Briefcase clasp */
.briefcase-inner::before {
  content: "";
  position: absolute;
  top: 45%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 18px;
  background: #c9a84c;
  border-radius: 3px;
  border: 2px solid #8b6d3f;
  transition: transform 0.6s ease;
}

.briefcase.open .briefcase-inner::before {
  transform: translate(-50%, -120%);
}

.briefcase-label {
  font-size: 0.9rem;
  color: #777;
  font-style: italic;
}

/* --- Pokéball reveal --- */

.reveal-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
  animation: fadeIn 0.8s ease;
}

.reveal-title {
  font-size: 0.9rem;
  color: #777;
  font-style: italic;
}

.reveal-balls {
  display: flex;
  gap: 2rem;
  justify-content: center;
  align-items: flex-start;
  flex-wrap: wrap;
}

/* --- Ball wrap (each column) --- */

.ball-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  transition: transform 0.25s;
  max-width: 200px;
}

.ball-wrap:hover {
  transform: translateY(-2px);
}

.ball-wrap.open {
  transform: translateY(-4px);
}

/* --- The Poké Ball itself --- */

.ball {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--ball-bottom, #f0f0f0);
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
  flex-shrink: 0;
}

.ball-top {
  position: absolute;
  inset: 0 0 50% 0;
  background: linear-gradient(180deg, var(--ball-top, #e04040) 0%, var(--ball-top, #e04040) 100%);
}

.ball-band {
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  height: 7px;
  background: #2a2a2a;
  z-index: 2;
}

.ball-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #f8f8f8;
  border: 3px solid #2a2a2a;
  z-index: 3;
}

/* Shiny star on the pokéball button */
.ball.shiny .ball-btn {
  background: #fffde0;
  border-color: #c9a84c;
}

.ball.shiny .ball-btn::after {
  content: "\2605";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  font-size: 10px;
  color: #c9a84c;
  line-height: 1;
  z-index: 5;
  animation: starTwinkle 1.2s ease-in-out infinite;
}

.ball-shine {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 33%,
    rgba(255,255,255,0.35) 0%,
    transparent 45%,
    rgba(0,0,0,0.1) 100%);
  pointer-events: none;
  z-index: 4;
}

/* --- Ball labels --- */

.ball-genus {
  font-size: 0.7rem;
  color: #999;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-align: center;
}

.ball-hint {
  font-size: 0.72rem;
  color: #888;
  font-style: italic;
  text-align: center;
  line-height: 1.4;
  max-width: 160px;
}

/* --- Open state (peeking) --- */

.ball-wrap.open .ball {
  margin-bottom: 0.5rem;
}

.ball-artwork {
  width: 140px;
  height: 140px;
  object-fit: contain;
  animation: peekUp 0.5s ease;
  margin-top: 0.25rem;
}

@keyframes peekUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ball-name {
  font-size: 1.15rem;
  font-weight: bold;
  color: #444;
}

.ball-star {
  display: inline-block;
  font-size: 1.1rem;
  color: #c9a84c;
  animation: starTwinkle 1.2s ease-in-out infinite;
  line-height: 1;
  vertical-align: middle;
  margin-left: 2px;
}

.ball-flavor {
  font-size: 0.78rem;
  color: #777;
  font-style: italic;
  text-align: center;
  line-height: 1.45;
  max-width: 180px;
}

.ball-prompt {
  font-size: 0.7rem;
  color: #b8860b;
  font-style: italic;
  animation: gentlePulse 1.5s ease-in-out infinite;
}

/* --- Shiny reveal --- */

.shiny-reveal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  animation: fadeIn 0.6s ease;
}

.shiny-reveal.is-shiny {
  position: relative;
}

.shiny-flash {
  position: absolute;
  inset: -20px;
  border-radius: 20px;
  background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%);
  animation: shinyPulse 1.5s ease-out;
  pointer-events: none;
}

@keyframes shinyPulse {
  0%   { opacity: 1; transform: scale(0.8); }
  50%  { opacity: 0.6; transform: scale(1.1); }
  100% { opacity: 0; transform: scale(1); }
}

.shiny-artwork {
  width: 200px;
  height: 200px;
  object-fit: contain;
  animation: gentlePulse 2s ease-in-out infinite;
}

@keyframes gentlePulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.04); }
}

.shiny-name-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.shiny-name {
  font-size: 1.4rem;
  font-weight: bold;
  color: #444;
}

.shiny-star {
  display: inline-block;
  font-size: 1.6rem;
  color: #c9a84c;
  animation: starTwinkle 1.2s ease-in-out infinite;
  line-height: 1;
}

@keyframes starTwinkle {
  0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
  25%  { transform: scale(1.3) rotate(10deg); opacity: 0.8; }
  50%  { transform: scale(1.15) rotate(-5deg); opacity: 1; }
  75%  { transform: scale(1.25) rotate(5deg); opacity: 0.7; }
}

.shiny-genus {
  font-size: 0.85rem;
  color: #888;
  font-style: italic;
}


/* --- "You are..." screen --- */

.you-are-screen {
  text-align: center;
  gap: 2rem;
  cursor: pointer;
}

.you-are-label {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 0.75rem;
  color: #999;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

.you-are-text {
  font-size: 1.2rem;
  line-height: 1.75;
  color: #4a4a4a;
  max-width: 460px;
  font-style: italic;
}

.aesthetic-screen {
  text-align: center;
  gap: 1.5rem;
}

.aesthetic-label {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 0.75rem;
  color: #999;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* --- Responsive --- */

@media (max-width: 500px) {
  html { font-size: 16px; }
  body { padding: 1rem; }
  .question-text { font-size: 1.05rem; }
  .reveal-balls { flex-direction: column; align-items: center; }
  .ball-artwork { width: 110px; height: 110px; }
}
  </style>

      { text: "Belly flop!", weight: { reach: 0, tempo: -2, nature: -1, tether: 0, aura: 0 } },
      { text: "Curl up and stay there. Possibly forever.", weight: { reach: 0, tempo: 2, nature: -1.5, tether: 0, aura: 0 } },
      { text: "Check the thread count first.", weight: { reach: 0, tempo: 2, nature: 1.5, tether: 0, aura: 0 } }
    ] },

  // -- Tempo × Tether --

  { id: "q19", primary: "tempo", secondary: "tether",
    text: "Are you often late?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: -3, nature: 0, tether: 0.5, aura: 0 } },
      { text: "No.", weight: { reach: 0, tempo: 3, nature: 0, tether: -0.5, aura: 0 } }
    ] },

  { id: "q20", primary: "tempo", secondary: "tether",
    text: "You win the lottery. What do you do with the money?",
    options: [
      { text: "Spend it now.", weight: { reach: 0, tempo: -2.5, nature: 0, tether: 1, aura: 0 } },
      { text: "Save it.", weight: { reach: 0, tempo: 2.5, nature: 0, tether: 1, aura: 0 } },
      { text: "Give most of it away. To family, friends, the person who always holds the door at the bakery.", weight: { reach: 0, tempo: 2.5, nature: 0, tether: -1, aura: 0 } }
    ] },

  { id: "q21", primary: "tempo", secondary: "tether",
    text: "It's your day off. No obligations. What does the morning look like?",
    options: [
      { text: "Up early. Coffee, book, sun coming up. The quiet hours are sacred.", weight: { reach: 0, tempo: 2, nature: 0, tether: 1.5, aura: 0 } },
      { text: "Three projects deep by 9am. Not work — things I actually want to do.", weight: { reach: 0, tempo: -2, nature: 0, tether: 1.5, aura: 0 } },
      { text: "Sleep in. Lie there deciding what kind of day it's going to be. The deciding is part of it.", weight: { reach: 0, tempo: 2, nature: 0, tether: -1.5, aura: 0 } },
      { text: "Whatever I feel like. Maybe I start cleaning and end up painting a wall. The point is no plan.", weight: { reach: 0, tempo: -2, nature: 0, tether: -1.5, aura: 0 } }
    ] },

  // -- Tempo × Aura --

  { id: "q22", primary: "tempo", secondary: "aura",
    text: "When you see a switch, do you feel an overwhelming urge to flip it?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: -3, nature: 0, tether: 0, aura: 0.5 } },
      { text: "No.", weight: { reach: 0, tempo: 3, nature: 0, tether: 0, aura: -0.5 } }
    ] },

  { id: "q23", primary: "tempo", secondary: "aura",
    text: "Your friend fails to show up at the promised time.",
    options: [
      { text: "I'm already texting them. Where are you??", weight: { reach: 0, tempo: -2.5, nature: 0, tether: 0, aura: -1 } },
      { text: "I wait. They'll get here. People run late.", weight: { reach: 0, tempo: 2.5, nature: 0, tether: 0, aura: -1 } },
      { text: "I order for them. Guess what they'd want. If I get it wrong it's funnier.", weight: { reach: 0, tempo: 2.5, nature: 0, tether: 0, aura: 1 } }
    ] },

  { id: "q24", primary: "tempo", secondary: "aura",
    text: "You find an old clock in a junk shop. It still works. Do you buy it?",
    options: [
      { text: "Yes!", weight: { reach: 0, tempo: -2, nature: 0, tether: 0, aura: -1.5 } },
      { text: "Yes.", weight: { reach: 0, tempo: 2, nature: 0, tether: 0, aura: 1.5 } },
      { text: "Nope.", weight: { reach: 0, tempo: -2, nature: 0, tether: 0, aura: 1.5 } },
      { text: "No.", weight: { reach: 0, tempo: 2, nature: 0, tether: 0, aura: -1.5 } }
    ] },

  // ================================================================
  // NATURE (Wild ↔ Wrought) — 12 questions
  // ================================================================

  // -- Nature × Reach --

  { id: "q25", primary: "nature", secondary: "reach",
    text: "Do you prefer to play outside rather than inside?",
    options: [
      { text: "Yes.", weight: { reach: -0.5, tempo: 0, nature: -3, tether: 0, aura: 0 } },
      { text: "No.", weight: { reach: 0.5, tempo: 0, nature: 3, tether: 0, aura: 0 } }
    ] },

  { id: "q26", primary: "nature", secondary: "reach",
    text: "You're lost in an unfamiliar city.",
    options: [
      { text: "Follow my gut. Walk toward what feels right — the light, the noise, the smell of bread.", weight: { reach: -1, tempo: 0, nature: -2.5, tether: 0, aura: 0 } },
      { text: "Open maps, triangulate my position, calculate the fastest route.", weight: { reach: 1, tempo: 0, nature: 2.5, tether: 0, aura: 0 } },
      { text: "Ask someone. They've lived here their whole life and know things the map doesn't.", weight: { reach: 0, tempo: 0, nature: -2.5, tether: 0, aura: 0 } }
    ] },

  { id: "q27", primary: "nature", secondary: "reach",
    text: "You find an injured bird on the sidewalk.",
    options: [
      { text: "Pick it up. Warm hands. Quiet voice. I've done this before.", weight: { reach: -1.5, tempo: 0, nature: -2, tether: 0, aura: 0 } },
      { text: "Look up wildlife rehab centres on my phone. Call the one with the best reviews.", weight: { reach: -1.5, tempo: 0, nature: 2, tether: 0, aura: 0 } },
      { text: "Pick it up and carry it three miles to the nearest vet. I don't care if it takes all afternoon.", weight: { reach: 1.5, tempo: 0, nature: -2, tether: 0, aura: 0 } },
      { text: "Research the species, its migration pattern, what it eats. If I understand the bird, I can help the bird.", weight: { reach: 1.5, tempo: 0, nature: 2, tether: 0, aura: 0 } }
    ] },

  // -- Nature × Tempo --

  { id: "q28", primary: "nature", secondary: "tempo",
    text: "Would you rather fix something broken or replace it?",
    options: [
      { text: "Fix it.", weight: { reach: 0, tempo: 0.5, nature: -3, tether: 0, aura: 0 } },
      { text: "Replace it.", weight: { reach: 0, tempo: -0.5, nature: 3, tether: 0, aura: 0 } }
    ] },

  { id: "q29", primary: "nature", secondary: "tempo",
    text: "You're cooking. How do you measure ingredients?",
    options: [
      { text: "By feel. A handful of this, a pinch of that. My grandmother cooked this way.", weight: { reach: 0, tempo: 1, nature: -2.5, tether: 0, aura: 0 } },
      { text: "I weigh everything. Cooking is chemistry if you're honest about it.", weight: { reach: 0, tempo: 1, nature: 2.5, tether: 0, aura: 0 } },
      { text: "I don't cook. I assemble. Toast, eggs, done in six minutes.", weight: { reach: 0, tempo: -1, nature: 2.5, tether: 0, aura: 0 } }
    ] },

  { id: "q30", primary: "nature", secondary: "tempo",
    text: "Which of these sounds makes you stop what you're doing?",
    options: [
      { text: "Wind through pine trees — that low hum that sounds like the earth breathing.", weight: { reach: 0, tempo: 1.5, nature: -2, tether: 0, aura: 0 } },
      { text: "Thunder directly overhead. The crack before you've finished registering the flash.", weight: { reach: 0, tempo: -1.5, nature: -2, tether: 0, aura: 0 } },
      { text: "A train horn at night, far away. Someone somewhere is arriving or leaving.", weight: { reach: 0, tempo: 1.5, nature: 2, tether: 0, aura: 0 } },
      { text: "A dial-up modem. No, seriously — it's a handshake between two machines that have never met.", weight: { reach: 0, tempo: -1.5, nature: 2, tether: 0, aura: 0 } }
    ] },

  // -- Nature × Tether --

  { id: "q31", primary: "nature", secondary: "tether",
    text: "Do you trust your instincts?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: 0, nature: -3, tether: -0.5, aura: 0 } },
      { text: "Not really. That's why I double-check everything.", weight: { reach: 0, tempo: 0, nature: 3, tether: 0.5, aura: 0 } }
    ] },

  { id: "q32", primary: "nature", secondary: "tether",
    text: "A garden has been untended all season. The gate is open.",
    options: [
      { text: "Walk through slowly, touching each stem. I name the plants I know and wonder about the ones I don't.", weight: { reach: 0, tempo: 0, nature: -2.5, tether: -1, aura: 0 } },
      { text: "Sit on the wall and look. Not fixing anything. Just looking. The neglect is part of its shape.", weight: { reach: 0, tempo: 0, nature: -2.5, tether: 1, aura: 0 } },
      { text: "Start planning the restoration. Irrigation, companion planting, bloom schedule. This garden is a system.", weight: { reach: 0, tempo: 0, nature: 2.5, tether: 0, aura: 0 } }
    ] },

  { id: "q33", primary: "nature", secondary: "tether",
    text: "You're moving house. The thing you pack last — the thing you didn't want to put in a box at all:",
    options: [
      { text: "A rock my kid gave me when they were four. It's just a rock. I've moved it across three cities.", weight: { reach: 0, tempo: 0, nature: -2, tether: -1.5, aura: 0 } },
      { text: "A kitchen knife my grandfather made. The handle's worn to the shape of three generations of hands.", weight: { reach: 0, tempo: 0, nature: 2, tether: -1.5, aura: 0 } },
      { text: "A book I've never lent anyone. The notes in the margins are basically a diary.", weight: { reach: 0, tempo: 0, nature: -2, tether: 1.5, aura: 0 } },
      { text: "My hard drive. I know the cloud exists. I don't care. Some things should have weight.", weight: { reach: 0, tempo: 0, nature: 2, tether: 1.5, aura: 0 } }
    ] },

  // -- Nature × Aura --

  { id: "q34", primary: "nature", secondary: "aura",
    text: "Do you believe in fate?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: 0, nature: -3, tether: 0, aura: -0.5 } },
      { text: "No.", weight: { reach: 0, tempo: 0, nature: 3, tether: 0, aura: 0.5 } }
    ] },

  { id: "q35", primary: "nature", secondary: "aura",
    text: "A tool breaks in your hand. Your first thought:",
    options: [
      { text: "I can fix this. Where's the toolbox?", weight: { reach: 0, tempo: 0, nature: -2.5, tether: 0, aura: -1 } },
      { text: "I can fix this. Where's the manual?", weight: { reach: 0, tempo: 0, nature: 2.5, tether: 0, aura: -1 } },
      { text: "I was looking for an excuse to replace this anyway.", weight: { reach: 0, tempo: 0, nature: 2.5, tether: 0, aura: 1 } }
    ] },

  { id: "q36", primary: "nature", secondary: "aura",
    text: "You're alone at the beach at sunset. The tide is going out.",
    options: [
      { text: "Standing at the waterline, feeling the sand pull away under my feet. Not thinking. Just there.", weight: { reach: 0, tempo: 0, nature: -2, tether: 0, aura: -1.5 } },
      { text: "Looking for interesting shells. Each one is a hundred thousand years old. The ocean is just showing off.", weight: { reach: 0, tempo: 0, nature: -2, tether: 0, aura: 1.5 } },
      { text: "Taking photos for reference.", weight: { reach: 0, tempo: 0, nature: 2, tether: 0, aura: -1.5 } },
      { text: "Building a sandcastle that's definitely going to be gone in an hour. That's the point.", weight: { reach: 0, tempo: 0, nature: 2, tether: 0, aura: 1.5 } }
    ] },

  // ================================================================
  // TETHER (Kith ↔ Kinless) — 12 questions
  // ================================================================

  // -- Tether × Reach --

  { id: "q37", primary: "tether", secondary: "reach",
    text: "Do you feel lonely when you're alone?",
    options: [
      { text: "Yes.", weight: { reach: -0.5, tempo: 0, nature: 0, tether: -3, aura: 0 } },
      { text: "No.", weight: { reach: 0.5, tempo: 0, nature: 0, tether: 3, aura: 0 } }
    ] },

  { id: "q38", primary: "tether", secondary: "reach",
    text: "It's the weekend, but no one can hang out.",
    options: [
      { text: "Go on a trip by myself. That's freedom, not loneliness.", weight: { reach: 1, tempo: 0, nature: 0, tether: 2.5, aura: 0 } },
      { text: "Honestly? Kind of relieved. I needed the day.", weight: { reach: -1, tempo: 0, nature: 0, tether: 2.5, aura: 0 } },
      { text: "Call someone else. There's always someone.", weight: { reach: 0, tempo: 0, nature: 0, tether: -2.5, aura: 0 } }
    ] },

  { id: "q39", primary: "tether", secondary: "reach",
    text: "You walk into a room of people you don't know. What do you actually notice first?",
    options: [
      { text: "Who looks like they don't want to be here. I usually find that person and stand near them.", weight: { reach: -1.5, tempo: 0, nature: 0, tether: -2, aura: 0 } },
      { text: "Who's already laughing.", weight: { reach: -1.5, tempo: 0, nature: 0, tether: -2, aura: 0 } },
      { text: "The layout. Where the door is, where the quiet corner is, how long I need to stay.", weight: { reach: 1.5, tempo: 0, nature: 0, tether: 2, aura: 0 } },
      { text: "Whether anyone else is also standing alone. Easier to be alone near someone else who's alone.", weight: { reach: 1.5, tempo: 0, nature: 0, tether: 2, aura: 0 } }
    ] },

  // -- Tether × Tempo --

  { id: "q40", primary: "tether", secondary: "tempo",
    text: "Do you hate being the last person to leave?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: 0.5, nature: 0, tether: -3, aura: 0 } },
      { text: "No.", weight: { reach: 0, tempo: -0.5, nature: 0, tether: 3, aura: 0 } }
    ] },

  { id: "q41", primary: "tether", secondary: "tempo",
    text: "Someone you barely know asks if you want to grab coffee.",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: -1, nature: 0, tether: -2.5, aura: 0 } },
      { text: "Maybe. Let me check my calendar.", weight: { reach: 0, tempo: 1, nature: 0, tether: 2.5, aura: 0 } },
      { text: "Yes, but I need at least a day's notice. Spontaneity is not my thing.", weight: { reach: 0, tempo: 1, nature: 0, tether: 2.5, aura: 0 } }
    ] },

  { id: "q42", primary: "tether", secondary: "tempo",
    text: "The phone rings. Unknown number.",
    options: [
      { text: "Answer it. Could be important. Could be a wrong number with a great story.", weight: { reach: 0, tempo: -1.5, nature: 0, tether: -2, aura: 0 } },
      { text: "Let it ring. If it's important they'll leave a message.", weight: { reach: 0, tempo: 1.5, nature: 0, tether: 2, aura: 0 } },
      { text: "Answer it, but I'm already annoyed. Unknown callers are never good news.", weight: { reach: 0, tempo: -1.5, nature: 0, tether: -2, aura: 0 } },
      { text: "Stare at it until it stops. Google the number. Never do anything with the information.", weight: { reach: 0, tempo: 1.5, nature: 0, tether: 2, aura: 0 } }
    ] },

  // -- Tether × Nature --

  { id: "q43", primary: "tether", secondary: "nature",
    text: "There is a wallet on the ground. No one around.",
    options: [
      { text: "Turn it in.", weight: { reach: 0, tempo: 0, nature: -0.5, tether: -3, aura: 0 } },
      { text: "Leave it. Not my problem.", weight: { reach: 0, tempo: 0, nature: 0.5, tether: 3, aura: 0 } }
    ] },

  { id: "q44", primary: "tether", secondary: "nature",
    text: "Your neighbour's cat starts visiting your porch every day.",
    options: [
      { text: "I've already named it. I know it has a real name. I don't care.", weight: { reach: 0, tempo: 0, nature: -1, tether: -2.5, aura: 0 } },
      { text: "I put out water. Then food. Then a bed. This is how you get a cat, apparently.", weight: { reach: 0, tempo: 0, nature: -1, tether: -2.5, aura: 0 } },
      { text: "I acknowledge the cat but maintain a respectful distance. Two independent entities coexisting.", weight: { reach: 0, tempo: 0, nature: 1, tether: 2.5, aura: 0 } }
    ] },

  { id: "q45", primary: "tether", secondary: "nature",
    text: "A friend is moving away. The going-away party is over. Everyone's gone.",
    options: [
      { text: "Help them pack the last box. The one with the weird stuff — the lamp that doesn't work, the mug with no handle.", weight: { reach: 0, tempo: 0, nature: -1.5, tether: -2, aura: 0 } },
      { text: "Give them a spreadsheet of restaurants near their new place. Already researched. With notes.", weight: { reach: 0, tempo: 0, nature: 1.5, tether: -2, aura: 0 } },
      { text: "Leave before the party ends. Goodbyes are easier when you don't actually say them.", weight: { reach: 0, tempo: 0, nature: -1.5, tether: 2, aura: 0 } },
      { text: "Stay late, but not to help. Just to be in the empty apartment one more time.", weight: { reach: 0, tempo: 0, nature: 1.5, tether: 2, aura: 0 } }
    ] },

  // -- Tether × Aura --

  { id: "q46", primary: "tether", secondary: "aura",
    text: "Do you like parties?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: 0, nature: 0, tether: -3, aura: 0.5 } },
      { text: "No.", weight: { reach: 0, tempo: 0, nature: 0, tether: 3, aura: -0.5 } }
    ] },

  { id: "q47", primary: "tether", secondary: "aura",
    text: "Somebody calls you 'weird but funny.' How does that make you feel?",
    options: [
      { text: "Happy! That's exactly what I'm going for.", weight: { reach: 0, tempo: 0, nature: 0, tether: -1, aura: 2.5 } },
      { text: "I'll take it. Weird is better than boring.", weight: { reach: 0, tempo: 0, nature: 0, tether: -1, aura: 2.5 } },
      { text: "Not happy. I wasn't trying to be weird.", weight: { reach: 0, tempo: 0, nature: 0, tether: 1, aura: -2.5 } }
    ] },

  { id: "q48", primary: "tether", secondary: "aura",
    text: "A stranger in a café is crying quietly. You notice.",
    options: [
      { text: "Go over. Ask if they're okay.", weight: { reach: 0, tempo: 0, nature: 0, tether: -2, aura: -1.5 } },
      { text: "Send over a pastry with a note that says 'whatever it is, you get a free pastry.' Don't sign it.", weight: { reach: 0, tempo: 0, nature: 0, tether: -2, aura: 1.5 } },
      { text: "Nothing. They're not crying to be rescued. Giving space is its own kind of respect.", weight: { reach: 0, tempo: 0, nature: 0, tether: 2, aura: -1.5 } },
      { text: "Notice, then spend twenty minutes inventing their life story. They've lived three different lives in my head.", weight: { reach: 0, tempo: 0, nature: 0, tether: 2, aura: 1.5 } }
    ] },

  // ================================================================
  // AURA (Earnest ↔ Capricious) — 12 questions
  // ================================================================

  // -- Aura × Reach --

  { id: "q49", primary: "aura", secondary: "reach",
    text: "Do you like pranks?",
    options: [
      { text: "Yes.", weight: { reach: 0.5, tempo: 0, nature: 0, tether: 0, aura: 3 } },
      { text: "No.", weight: { reach: -0.5, tempo: 0, nature: 0, tether: 0, aura: -3 } }
    ] },

  { id: "q50", primary: "aura", secondary: "reach",
    text: "Have you ever blurted something out and immediately regretted it?",
    options: [
      { text: "Yes.", weight: { reach: -1, tempo: 0, nature: 0, tether: 0, aura: 2.5 } },
      { text: "Yes, and I've turned it into a bit. Now people think I'm just 'honest.'", weight: { reach: 1, tempo: 0, nature: 0, tether: 0, aura: 2.5 } },
      { text: "Rarely. I think before I speak.", weight: { reach: 0, tempo: 0, nature: 0, tether: 0, aura: -2.5 } }
    ] },

  { id: "q51", primary: "aura", secondary: "reach",
    text: "Your friend describes you to someone who's never met you. Which description would sting the most?",
    options: [
      { text: "'They're reliable. Does what they say they'll do.' — said flat, like describing a toaster.", weight: { reach: -1.5, tempo: 0, nature: 0, tether: 0, aura: -2 } },
      { text: "'They're hilarious. You never know what they'll say.' — when you were trying to be serious.", weight: { reach: -1.5, tempo: 0, nature: 0, tether: 0, aura: 2 } },
      { text: "'I don't think they really need anyone.' — said lightly, just accepted as true.", weight: { reach: 1.5, tempo: 0, nature: 0, tether: 0, aura: -2 } },
      { text: "'They're fun.' — just that. Nothing else. Like that's the whole summary.", weight: { reach: 1.5, tempo: 0, nature: 0, tether: 0, aura: 2 } }
    ] },

  // -- Aura × Tempo --

  { id: "q52", primary: "aura", secondary: "tempo",
    text: "Do you often yawn?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: 0.5, nature: 0, tether: 0, aura: 3 } },
      { text: "No.", weight: { reach: 0, tempo: -0.5, nature: 0, tether: 0, aura: -3 } }
    ] },

  { id: "q53", primary: "aura", secondary: "tempo",
    text: "You're daydreaming when your friend sprays you with water.",
    options: [
      { text: "Woo-hoo! Water fight!", weight: { reach: 0, tempo: -1, nature: 0, tether: 0, aura: 2.5 } },
      { text: "Get mad. That was completely uncalled for.", weight: { reach: 0, tempo: -1, nature: 0, tether: 0, aura: -2.5 } },
      { text: "Sigh deeply. Give them a look. Return to my daydream.", weight: { reach: 0, tempo: 1, nature: 0, tether: 0, aura: -2.5 } }
    ] },

  { id: "q54", primary: "aura", secondary: "tempo",
    text: "You've just been handed the microphone at karaoke. It's not a song you chose.",
    options: [
      { text: "Sing it. Badly. Enthusiastically. The badness IS the performance.", weight: { reach: 0, tempo: -1.5, nature: 0, tether: 0, aura: 2 } },
      { text: "Sing it earnestly.", weight: { reach: 0, tempo: 1.5, nature: 0, tether: 0, aura: 2 } },
      { text: "Hand the mic back. I don't sing in public. That's not shyness — it's a boundary.", weight: { reach: 0, tempo: 1.5, nature: 0, tether: 0, aura: -2 } },
      { text: "Leave. Karaoke is my nightmare. I'm already out the door.", weight: { reach: 0, tempo: -1.5, nature: 0, tether: 0, aura: -2 } }
    ] },

  // -- Aura × Nature --

  { id: "q55", primary: "aura", secondary: "nature",
    text: "Do you like groan-inducing puns?",
    options: [
      { text: "Love them. The worse the better.", weight: { reach: 0, tempo: 0, nature: -0.5, tether: 0, aura: 3 } },
      { text: "Spare me. Please.", weight: { reach: 0, tempo: 0, nature: 0.5, tether: 0, aura: -3 } }
    ] },

  { id: "q56", primary: "aura", secondary: "nature",
    text: "You see a cake that's one day past its expiration date.",
    options: [
      { text: "Not a problem! Chow time!", weight: { reach: 0, tempo: 0, nature: -1, tether: 0, aura: 2.5 } },
      { text: "Sniff it. Examine it. Google whether this is safe. Proceed with caution.", weight: { reach: 0, tempo: 0, nature: 1, tether: 0, aura: -2.5 } },
      { text: "Throw it out. Why risk it over a cake?", weight: { reach: 0, tempo: 0, nature: 1, tether: 0, aura: -2.5 } }
    ] },

  { id: "q57", primary: "aura", secondary: "nature",
    text: "Someone gives you a houseplant. Not a cute succulent — a big, dramatic fern that needs constant attention.",
    options: [
      { text: "Name it immediately. It's part of the household now.", weight: { reach: 0, tempo: 0, nature: -1.5, tether: 0, aura: 2 } },
      { text: "Research its needs. Humidity, soil pH, exact angle of indirect light. This fern will thrive or I will die trying.", weight: { reach: 0, tempo: 0, nature: 1.5, tether: 0, aura: -2 } },
      { text: "Put it in the window. Water it when I remember. If it dies it dies. We had a good run.", weight: { reach: 0, tempo: 0, nature: -1.5, tether: 0, aura: 2 } },
      { text: "Regift it immediately. I know my limits and a dramatic fern is beyond them.", weight: { reach: 0, tempo: 0, nature: 1.5, tether: 0, aura: -2 } }
    ] },

  // -- Aura × Tether --

  { id: "q58", primary: "aura", secondary: "tether",
    text: "Do you laugh a lot?",
    options: [
      { text: "Yes.", weight: { reach: 0, tempo: 0, nature: 0, tether: -0.5, aura: 3 } },
      { text: "Not really. I smile. That's different.", weight: { reach: 0, tempo: 0, nature: 0, tether: 0.5, aura: -3 } }
    ] },

  { id: "q59", primary: "aura", secondary: "tether",
    text: "Have you ever looked at your reflection and thought, 'I'm actually pretty cool'?",
    options: [
      { text: "Certainly! Multiple times.", weight: { reach: 0, tempo: 0, nature: 0, tether: 1, aura: 2.5 } },

// ===== Poké_Mystery Engine =====
// Vector accumulation, trio selection, shiny roll, vector description.
// Attaches to window.Poke_Mystery.

Poke_Mystery.engine = (function() {

  // --- Constants ---
  var SHINY_ODDS = 10;  // 1-in-10 personal shiny roll (on chosen Pokémon)

  // --- Question sampling ---

  function sampleQuestions(pool, count) {
    var axes = ["reach", "tempo", "nature", "tether", "aura"];
    var perAxis = Math.floor(count / axes.length);
    var sampled = [];

    axes.forEach(function(axis) {
      var group = pool.filter(function(q) { return q.primary === axis; });
      shuffle(group);
      sampled = sampled.concat(group.slice(0, perAxis));
    });

    shuffle(sampled);
    return sampled;
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
  }

  // --- Vector accumulation ---

  function accumulate(vector, weight) {
    var axes = ["reach", "tempo", "nature", "tether", "aura"];
    var out = vector.slice();
    axes.forEach(function(axis, i) {
      out[i] += (weight[axis] || 0);
    });
    return out;
  }

  // --- 5D distance helpers ---

  function axisDistance(a, b) {
    var dist = 0;
    for (var i = 0; i < 5; i++) {
      var d = a[i] - b[i];
      dist += d * d;
    }
    return Math.sqrt(dist);
  }

  function scoreAll(userVector, pokemonData) {
    var scored = pokemonData.map(function(p) {
      return { pokemon: p, distance: axisDistance(userVector, p.coords) };
    });
    scored.sort(function(a, b) { return a.distance - b.distance; });
    return scored;
  }

  // --- Nearest-neighbor matching (simple top-N) ---

  function nearestNeighbors(userVector, pokemonData, n) {
    n = n || 3;
    var scored = scoreAll(userVector, pokemonData);
    return scored.slice(0, n).map(function(s) { return s.pokemon; });
  }

  // --- Diversified trio selection ---
  // Weighted random draw from top candidates so dense-cluster Pokémon
  // (starters, early-route) get a fair shot alongside extreme outliers.

  function weightedPick(candidates, weightFn) {
    var total = 0;
    var weights = [];
    candidates.forEach(function(c, i) {
      var w = Math.max(0, weightFn(c, i));
      weights.push(w);
      total += w;
    });
    if (total <= 0) return candidates[0];
    var roll = Math.random() * total;
    var cum = 0;
    for (var i = 0; i < candidates.length; i++) {
      cum += weights[i];
      if (roll <= cum) return candidates[i];
    }
    return candidates[candidates.length - 1];
  }

  function selectTrio(userVector, pokemonData, aestheticPrefs) {
    var scored = scoreAll(userVector, pokemonData);

    // Mirror: weighted random from top 25, weight = 1/(rank+2)
    var mirrorCandidates = scored.slice(0, Math.min(25, scored.length));
    var mirror = weightedPick(mirrorCandidates, function(c, i) {
      return 1 / (i + 2);
    }).pokemon;

    // Shadow: weighted random from rank 5-40, weighted by distance-from-mirror
    var shadowPool = scored.slice(5, Math.min(40, scored.length));
    var shadowWeights = shadowPool.map(function(s) {
      return axisDistance(mirror.coords, s.pokemon.coords);
    });
    var bestShadow = weightedPick(shadowPool, function(s, i) {
      return shadowWeights[i];
    }).pokemon;

    // Stranger: weighted random from rank 15-80, weighted by min-dist-from-both
    var strangerPool = scored.slice(15, Math.min(80, scored.length));
    var strangerWeights = strangerPool.map(function(s) {
      var dM = axisDistance(mirror.coords, s.pokemon.coords);
      var dS = axisDistance(bestShadow.coords, s.pokemon.coords);
      return Math.min(dM, dS);
    });
    var bestStranger = weightedPick(strangerPool, function(s, i) {
      return strangerWeights[i];
    }).pokemon;

    var trio = [mirror, bestShadow, bestStranger];

    if (aestheticPrefs) {
      trio = applyAestheticFilter(trio, scored, aestheticPrefs);
    } else {
      trio = ensureVisualDiversity(trio, scored);
    }

    return trio;
  }

  function ensureVisualDiversity(trio, scored) {
    var result = trio.slice();

    if (sharesVisual(result[0], result[1])) {
      for (var i = 5; i < Math.min(60, scored.length); i++) {
        if (!sharesVisual(result[0], scored[i].pokemon) &&

        }
      }
    }

    // Find the Pokémon's strongest axis
    var axes = AXIS_NAMES.map(function(axis, i) {
      return { axis: axis, value: pokemon.coords[i], abs: Math.abs(pokemon.coords[i]) };
    });
    axes.sort(function(a, b) { return b.abs - a.abs; });

    // Try the strongest axis first, then fall back to weaker ones
    for (var ai = 0; ai < axes.length; ai++) {
      var a = axes[ai];
      var dir = a.value > 0 ? 1 : -1;

      var matches = pool.filter(function(p) {
        if (p.axis !== a.axis) return false;
        if (p.dir !== dir) return false;
        if (a.abs < (p.min || 0)) return false;
        if (p.exclude_shapes && p.exclude_shapes.indexOf(pokemon.shape) !== -1) return false;
        if (p.types && !p.types.some(function(t) { return pokemon.types.indexOf(t) !== -1; })) return false;
        return true;
      });

      if (matches.length > 0) {
        return matches[Math.floor(Math.random() * matches.length)].text;
      }
    }

    // Fallback — pick any phrase
    var any = pool[Math.floor(Math.random() * pool.length)];
    return any.text;
  }

  // --- Shiny picker for trio ---
  // Exactly one of the three cards shows shiny. Returns index 0, 1, or 2.

  function shinyWhich() {
    return Math.floor(Math.random() * 3);
  }

  // --- Personal shiny roll (on chosen Pokémon) ---

  function shinyRoll() {
    return Math.floor(Math.random() * SHINY_ODDS) === 0;
  }

  // --- Public API ---

  return {
    sampleQuestions: sampleQuestions,
    accumulate: accumulate,
    nearestNeighbors: nearestNeighbors,
    selectTrio: selectTrio,
    describeVector: describeVector,
    phraseForRole: phraseForRole,
    shinyWhich: shinyWhich,
    shinyRoll: shinyRoll
  };

})();

// ===== environment.js =====
// ===== Poké_Mystery Environment Shifter =====
// CSS gradient background + canvas ink-drop overlay.
// Each answer spawns an expanding coloured drop that swirls and fades.
// Attaches to window.Poke_Mystery.

Poke_Mystery.environment = (function() {

  var body, canvas, ctx;
  var drops = [];
  var animId;

  // --- Init ---

  function init() {
    body = document.body;

    // Canvas overlay for ink drops
    canvas = document.createElement("canvas");
    canvas.className = "env-canvas";
    canvas.setAttribute("aria-hidden", "true");
    body.appendChild(canvas);

    ctx = canvas.getContext("2d");
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);

    animId = requestAnimationFrame(tick);
  }

  function sizeCanvas() {
    if (!canvas) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  // --- Animation loop ---

  function tick() {
    if (!ctx) return;

    // Fade existing drops gradually each frame
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,0.015)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw drops normally over the faded canvas
    ctx.globalCompositeOperation = "source-over";

    for (var i = drops.length - 1; i >= 0; i--) {
      var d = drops[i];
      d.age++;
      var t = d.age / d.lifespan;

      d.radius = d.startRadius + (d.maxRadius - d.startRadius) * Math.min(1, t * 1.6);
      d.alpha = d.startAlpha * (1 - t);

      if (d.alpha <= 0.003) {
        drops.splice(i, 1);
        continue;
      }

      // Sine-wave drift
      var driftX = Math.sin(d.age * 0.03 + d.phase) * 0.5;
      var driftY = Math.cos(d.age * 0.035 + d.phase) * 0.5;
      d.x += driftX;
      d.y += driftY;

      // Radial gradient: hard center, soft edge
      var grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.radius);
      var c = "hsla(" + d.hue + ", " + d.sat + "%, " + d.light + "%, " + d.alpha.toFixed(3) + ")";
      grad.addColorStop(0, c);
      grad.addColorStop(0.25, c);
      grad.addColorStop(1, "transparent");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    animId = requestAnimationFrame(tick);
  }

  // --- Per-axis drop colours ---
  // Each axis gets a base hue; answer direction shifts it warmer or cooler.

  var AXIS_HUES = { reach: 240, tempo: 30, nature: 130, tether: 340, aura: 50 };

  function axisDropColor(weight) {
    var axes = ["reach", "tempo", "nature", "tether", "aura"];
    var bestAxis = "reach";
    var bestVal = 0;
    axes.forEach(function(a) {
      if (Math.abs(weight[a] || 0) > Math.abs(bestVal)) { bestVal = weight[a] || 0; bestAxis = a; }
    });
    var hue = (AXIS_HUES[bestAxis] || 200) + (bestVal > 0 ? 35 : -35);
    var sat = 60 + Math.abs(bestVal) * 4;
    var light = 45 + Math.random() * 10;
    return { hue: Math.round(hue), sat: Math.round(sat), light: Math.round(light) };
  }

  // --- Spawn a drop driven by the question axis, CSS gradient by the cumulative vector ---

  function update(vector, weight) {
    if (!body) return;

    // Normalize accumulated vector (for the CSS background)
    var normDiv = 3;
    var r = vector[0] / normDiv;
    var t = vector[1] / normDiv;
    var n = vector[2] / normDiv;
    var a = vector[4] / normDiv;

    var hueReach = 100 + r * 12;
    var hueTempo = 200 - t * 15;
    var natureSat = 0.4 + n * 0.06;
    var auraBrightness = 0.85 + a * 0.03;

    var hue1 = Math.round((hueReach + hueTempo) / 2);
    var hue2 = Math.round(hueReach);
    var sat = Math.round(natureSat * 100);
    var light = Math.round(auraBrightness * 100);

    var grad = "linear-gradient(135deg, "
      + "hsl(" + hue1 + ", " + sat + "%, " + Math.round(light - 5) + "%) 0%, "
      + "hsl(" + hue2 + ", " + sat + "%, " + light + "%) 100%)";

    body.style.background = grad;

    // Drop colour comes from the question's axis, not the cumulative vector
    var dc = weight ? axisDropColor(weight) : { hue: hue1, sat: Math.round(sat * 1.8), light: Math.round(light * 0.5) };
    spawnDrop(dc.hue, dc.sat, dc.light);
  }

  function spawnDrop(hue, sat, light) {
    if (!canvas) return;
    drops.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      hue: hue,
      sat: sat,
      light: light,
      startRadius: 30 + Math.random() * 30,
      maxRadius: 250 + Math.random() * 350,
      startAlpha: 0.25 + Math.random() * 0.3,
      alpha: 0,
      age: 0,
      lifespan: 250 + Math.random() * 250, // frames (~4-8 sec at 60fps)
      phase: Math.random() * Math.PI * 2
    });
  }

  // --- Reset ---

  function reset() {
    drops = [];
    if (ctx && canvas) {
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    if (body) {
      body.style.background = "";
    }
  }

  // --- Public API ---

  return {
    init: init,
    update: update,
    reset: reset
  };

})();

// ===== ui.js =====
// ===== Poké_Mystery UI =====
// Quiz interface, briefcase reveal, trio selection, shiny animation.
// Attaches to window.Poke_Mystery.

Poke_Mystery.ui = (function() {

  var container;

  // --- DOM helpers ---

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html) e.innerHTML = html;
    return e;
  }

  function on(sel, evt, fn) {
    var target = typeof sel === "string" ? document.querySelector(sel) : sel;
    if (target) target.addEventListener(evt, fn);
  }

  function off(sel, evt, fn) {
    var target = typeof sel === "string" ? document.querySelector(sel) : sel;
    if (target) target.removeEventListener(evt, fn);
  }

  function clear(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  // --- Intro screen ---

  function showIntro(onStart) {
    clear(container);
    var screen = el("div", "screen intro-screen");

    var tagline = el("p", "intro-tagline", "Take a quiz to reveal a Pok&eacute;mon mystery.");
    var btn = el("button", "btn-start", "Begin");
    btn.addEventListener("click", onStart);

    screen.appendChild(tagline);
    screen.appendChild(btn);
    container.appendChild(screen);
  }

  // --- Question screen ---

  function showQuestion(question, index, total, currentVector, onAnswer) {
    clear(container);
    var screen = el("div", "screen question-screen");

    var progress = el("div", "question-progress", (index + 1) + " / " + total);
    screen.appendChild(progress);

    var text = el("div", "question-text", question.text);
    screen.appendChild(text);

    var opts = el("div", "question-options");
    var numOpts = question.options.length;
    var optClass = "opt-" + numOpts;

    question.options.forEach(function(option) {
      var btn = el("button", "option-btn " + optClass, option.text);
      btn.addEventListener("click", function() {
        onAnswer(option.weight, btn);
      });
      opts.appendChild(btn);
    });

    screen.appendChild(opts);
    container.appendChild(screen);
  }

  // --- Aesthetic preference question ---

  function showAestheticQuestion(question, onAnswer) {
    clear(container);
    var screen = el("div", "screen aesthetic-screen");

    var label = el("div", "aesthetic-label", "One last thing...");
    screen.appendChild(label);

    var text = el("div", "question-text", question.text);
    screen.appendChild(text);

    var opts = el("div", "question-options");
    var numOpts = question.options.length;

    question.options.forEach(function(option) {
      var btn = el("button", "option-btn opt-" + numOpts, option.text);
      btn.addEventListener("click", function() {
        onAnswer(option.pref, btn);
      });
      opts.appendChild(btn);
    });

    screen.appendChild(opts);
    container.appendChild(screen);
  }

  // --- Briefcase transition ---

  function showBriefcase(onComplete) {
    clear(container);
    var screen = el("div", "screen briefcase-screen");

    var briefcase = el("div", "briefcase");
    var inner = el("div", "briefcase-inner");
    var label = el("div", "briefcase-label", "Professor Birch's briefcase rests in the grass.");
    briefcase.appendChild(inner);
    briefcase.appendChild(label);

    screen.appendChild(briefcase);
    container.appendChild(screen);

    setTimeout(function() {
      briefcase.classList.add("open");
      setTimeout(function() { onComplete(briefcase); }, 800);
    }, 1800);
  }

  // --- "You are..." screen ---

  function showYouAre(text, onComplete) {
    clear(container);
    var screen = el("div", "screen you-are-screen");

    var label = el("div", "you-are-label", "The briefcase stirs...");
    var body = el("div", "you-are-text", text);

    screen.appendChild(label);
    screen.appendChild(body);

    var done = false;
    function advance() {
      if (done) return;
      done = true;
      onComplete();
    }

    screen.addEventListener("click", advance);

    // Auto-advance after a generous read time
    setTimeout(advance, 6000);

    container.appendChild(screen);
  }

  // --- Pokéball reveal ---
  // Three closed Poké Balls appear. Genus + type hint shown before opening.
  // Click a ball to peek at the Pokémon + flavour text. Click again to lock in.
  // No shiny indication until after the choice is locked.

  var TYPE_HINTS = {
    fire: "The ball is warm to the touch.",
    water: "The ball is slick with seawater.",
    electric: "The ball crackles faintly with static.",
    grass: "The ball smells of fresh leaves and damp earth.",
    ice: "The ball is cold enough to fog your breath.",
    ghost: "The ball shimmers with an eerie, distant light.",
    psychic: "The ball hums — not audibly. Just... a feeling.",
    dragon: "The ball thrums with something ancient.",
    dark: "The ball drinks in the light around it.",
    fairy: "The ball glimmers with a soft, playful light.",
    fighting: "The ball vibrates with restrained force.",
    flying: "The ball feels lighter than it should.",
    poison: "The ball tingles faintly against your fingertips.",
    ground: "The ball is heavy. Soil and stone heavy.",
    rock: "The ball is solid, unyielding. Ancient.",
    bug: "The ball buzzes, just barely. Or maybe it's your pulse.",
    steel: "The ball is cool, precise. Machined.",
    normal: "The ball rests quietly. Unassuming. Content."
  };

  var BALL_TYPES = [
    { name: "poke",    top: "#e04040", bottom: "#f0f0f0" },
    { name: "great",   top: "#3878d8", bottom: "#f0f0f0" },
    { name: "ultra",   top: "#f8c040", bottom: "#f0f0f0" },
    { name: "master",  top: "#7838c8", bottom: "#f0f0f0" },
    { name: "safari",  top: "#78a050", bottom: "#f0f0f0" },
    { name: "moon",    top: "#3868c0", bottom: "#f0f0f0" },
    { name: "love",    top: "#f08098", bottom: "#f0f0f0" },
    { name: "heavy",   top: "#485868", bottom: "#c0c8d0" },
    { name: "luxury",  top: "#181820", bottom: "#f0f0f0" },
    { name: "premier", top: "#f0f0f0", bottom: "#f0f0f0" }
  ];

  function pickBallTypes() {
    var pool = BALL_TYPES.slice();
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    return pool.slice(0, 3);
  }

  function renderBall(ballType, isShiny) {
    var ball = el("div", "ball" + (isShiny ? " shiny" : ""));
    ball.style.setProperty("--ball-top", ballType.top);
    ball.style.setProperty("--ball-bottom", ballType.bottom);
    var top = el("div", "ball-top");
    var band = el("div", "ball-band");
    var btn = el("div", "ball-btn");
    var shine = el("div", "ball-shine");
    ball.appendChild(top);
    ball.appendChild(band);
    ball.appendChild(btn);
    ball.appendChild(shine);
    return ball;
  }

  function showPokeballReveal(trio, phrases, shinyIndex, onLockIn) {
    var screen = document.querySelector(".briefcase-screen");
    if (!screen) return;
    clear(screen);

    var ballTypes = pickBallTypes();
    var wrapper = el("div", "reveal-wrapper");
    var title = el("div", "reveal-title", "Three Poké Balls lie inside...");
    wrapper.appendChild(title);

    var ballsRow = el("div", "reveal-balls");
    var openedIndex = -1;
    var order = [1, 0, 2]; // shadow, mirror, stranger

    function render() {
      clear(ballsRow);

      order.forEach(function(origIdx, displayIdx) {
        var pokemon = trio[origIdx];
        var phrase = (phrases && phrases[origIdx]) ? phrases[origIdx] : "";
        var ballType = ballTypes[displayIdx];
        var isOpen = (displayIdx === openedIndex);
        var isShinyCard = (origIdx === shinyIndex);
        var primaryType = (pokemon.types && pokemon.types[0]) ? pokemon.types[0] : "normal";
        var typeHint = TYPE_HINTS[primaryType] || TYPE_HINTS["normal"];

        var wrap = el("div", "ball-wrap" + (isOpen ? " open" : ""));

        if (!isOpen) {
          // Closed state: ball sprite + genus + type hint
          wrap.appendChild(renderBall(ballType, isShinyCard));
          wrap.appendChild(el("div", "ball-genus", pokemon.genus || ""));
          wrap.appendChild(el("div", "ball-hint", typeHint));

          wrap.addEventListener("click", function() {
            openedIndex = displayIdx;
            render();
          });
        } else {
          // Open state: artwork (shiny if this is the shiny card) + name + flavour + prompt
          var art = el("img", "ball-artwork");
          art.src = isShinyCard ? (pokemon.artwork_shiny_url || pokemon.artwork_url) : (pokemon.artwork_url || "");
          art.alt = pokemon.name;
          art.loading = "lazy";

          var nameEl = el("div", "ball-name", capitalise(pokemon.name) + (isShinyCard ? ' <span class="ball-star">&#9733;</span>' : ""));
          var flavor = el("div", "ball-flavor", phrase);
          var prompt = el("div", "ball-prompt", "Click again to choose");

          wrap.appendChild(art);
          wrap.appendChild(nameEl);
          wrap.appendChild(flavor);
          wrap.appendChild(prompt);

          wrap.addEventListener("click", function() {
            onLockIn(pokemon);
          });
        }

        ballsRow.appendChild(wrap);
      });
    }

    render();
    wrapper.appendChild(ballsRow);
    screen.appendChild(wrapper);
  }

  // --- Shiny reveal ---

  function showShinyRoll(pokemon, isShiny, onContinue) {
    var screen = document.querySelector(".briefcase-screen");
    if (!screen) return;
    clear(screen);

    var reveal = el("div", "shiny-reveal");

    var img = el("img", "shiny-artwork");
    img.src = isShiny ? (pokemon.artwork_shiny_url || pokemon.artwork_url) : pokemon.artwork_url;
    img.alt = pokemon.name;

    var nameWrap = el("div", "shiny-name-wrap");

    var nameField = el("span", "shiny-name", capitalise(pokemon.name));

    if (isShiny) {
      reveal.classList.add("is-shiny");
      var flash = el("div", "shiny-flash");
      reveal.appendChild(flash);

      var star = el("span", "shiny-star", "★"); // ★
      nameWrap.appendChild(nameField);
      nameWrap.appendChild(star);
    } else {
      nameWrap.appendChild(nameField);
    }

    var genusField = el("div", "shiny-genus", pokemon.genus || "");

    reveal.appendChild(img);
    reveal.appendChild(nameWrap);
    reveal.appendChild(genusField);

    var retryBtn = el("button", "btn-retry", "Take the quiz again");
    retryBtn.addEventListener("click", onContinue);

    reveal.appendChild(retryBtn);
    screen.appendChild(reveal);
  }

  // --- Environment update ---

  function updateEnvironment(vector) {
    var hues = {
      reach: 120,
      tempo: 200,
      nature: 90,
      tether: 30,
      aura: 280
    };
    var axes = ["reach", "tempo", "nature", "tether", "aura"];
    var body = document.body;

    axes.forEach(function(axis, i) {
      var val = vector[i];
      var shift = Math.max(-20, Math.min(20, val * 1.5));
      body.style.setProperty("--hue-" + axis, (hues[axis] + shift));
      body.style.setProperty("--sat-" + axis, (50 + Math.abs(val) * 3) + "%");
    });
  }

  function capitalise(s) {
    if (!s) return "";
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  // --- Init ---

  function init() {
    container = document.getElementById("app");
  }

  return {
    init: init,
    showIntro: showIntro,
    showQuestion: showQuestion,
    showAestheticQuestion: showAestheticQuestion,
    showYouAre: showYouAre,
    showBriefcase: showBriefcase,
    showPokeballReveal: showPokeballReveal,
    showShinyRoll: showShinyRoll,
    updateEnvironment: updateEnvironment
  };

})();

// ===== main.js =====
// ===== Poké_Mystery Main =====
// State management, orchestration, init.
// Attaches to window.Poke_Mystery.

Poke_Mystery.main = (function() {

  // --- Toggles ---
  var AESTHETIC_PROBE_ENABLED = false;

  var state = {
    phase: "intro",           // intro | quiz | youare | briefcase | trio | chosen
    currentQuestionIndex: 0,
    userVector: [0, 0, 0, 0, 0],
    activeQuestions: [],
    trio: [],
    trioPhrases: [],           // arrival phrases for each trio card
    shinyIndex: 0,             // which trio card shows shiny (0, 1, or 2)
    chosenPokemon: null,
    isShiny: false,
    aestheticPrefs: {}         // accumulated from aesthetic probe
  };

  var pokemonData = [];
  var engine = Poke_Mystery.engine;
  var ui = Poke_Mystery.ui;
  var env = Poke_Mystery.environment;

  // --- Init ---

  function init() {
    ui.init();
    env.init();

    pokemonData = (window.POKE_MYSTERY_DATA && window.POKE_MYSTERY_DATA.pokemon) || [];

    startQuiz();
  }

  // --- Quiz lifecycle ---

  function startQuiz() {
    state.phase = "intro";
    state.currentQuestionIndex = 0;
    state.userVector = [0, 0, 0, 0, 0];
    state.activeQuestions = engine.sampleQuestions(Poke_Mystery.questions, 15);
    state.trio = [];
    state.trioPhrases = [];
    state.shinyIndex = 0;
    state.chosenPokemon = null;
    state.isShiny = false;
    state.aestheticPrefs = {};
    env.reset();

    ui.showIntro(function() {
      showNextQuestion();
    });
  }

  function showNextQuestion() {
    state.phase = "quiz";
    var idx = state.currentQuestionIndex;
    var questions = state.activeQuestions;

    if (idx >= questions.length) {
      finishQuiz();
      return;
    }

    ui.showQuestion(questions[idx], idx, questions.length, state.userVector, function(weight, btn) {
      btn.classList.add("selected");
      setTimeout(function() {
        answerQuestion(weight);
      }, 200);
    });
  }

  function answerQuestion(weight) {
    state.userVector = engine.accumulate(state.userVector, weight);
    env.update(state.userVector, weight);
    state.currentQuestionIndex++;

    showNextQuestion();
  }

  function finishQuiz() {
    if (AESTHETIC_PROBE_ENABLED && Poke_Mystery.aestheticProbe) {
      showAestheticProbe();
    } else {
      computeAndReveal();
    }
  }

  // --- Aesthetic preference probe ---

  function showAestheticProbe() {
    state.phase = "aesthetic";
    var probeQuestions = Poke_Mystery.aestheticProbe;
    var currentIdx = 0;

    function showNext() {
      if (currentIdx >= probeQuestions.length) {
        computeAndReveal();
        return;
      }

      var q = probeQuestions[currentIdx];
      ui.showAestheticQuestion(q, function(pref, btn) {
        btn.classList.add("selected");
        // Merge pref into accumulated aestheticPrefs
        if (pref.shape) state.aestheticPrefs.shape = pref.shape;
        if (pref.color) state.aestheticPrefs.color = pref.color;
        if (pref.vibe) state.aestheticPrefs.vibe = pref.vibe;
        currentIdx++;
        setTimeout(showNext, 150);
      });
    }

    showNext();
  }

  function computeAndReveal() {
    if (pokemonData.length === 0) {
      state.trio = [sampleFallbackPokemon()];
      state.trioPhrases = [""];
      state.shinyIndex = 0;
      showBriefcase();
      return;
    }

    var hasPrefs = state.aestheticPrefs && (state.aestheticPrefs.shape || state.aestheticPrefs.color || state.aestheticPrefs.vibe);
    state.trio = engine.selectTrio(state.userVector, pokemonData, hasPrefs ? state.aestheticPrefs : null);

    // Generate arrival phrases for each role
    state.trioPhrases = state.trio.map(function(p, i) {
      return engine.phraseForRole(p, i);
    });

    // Pick which card gets the shiny
    state.shinyIndex = engine.shinyWhich();

    // Show "You are..." screen before the briefcase
    showYouAreScreen();
  }

  function showYouAreScreen() {
    state.phase = "youare";
    var description = engine.describeVector(state.userVector);
    ui.showYouAre(description, function() {
      showBriefcase();
    });
  }

  function showBriefcase() {
    state.phase = "briefcase";
    ui.showBriefcase(function() {
      showPokeballReveal();
    });
  }

  function showPokeballReveal() {
    state.phase = "pokeballs";
    ui.showPokeballReveal(state.trio, state.trioPhrases, state.shinyIndex, function(pokemon) {
      state.chosenPokemon = pokemon;
      var pickedShinyCard = (pokemon === state.trio[state.shinyIndex]);
      state.isShiny = pickedShinyCard || engine.shinyRoll();
      state.phase = "chosen";
      ui.showShinyRoll(pokemon, state.isShiny, function() {
        startQuiz();
      });
    });
  }

  // --- Fallback (no JSON data loaded, e.g. raw dev file) ---

  function sampleFallbackPokemon() {
    return {
      id: 25,
